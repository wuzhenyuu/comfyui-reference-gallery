[project]
name = "comfyui-reference-gallery"
version = "0.2.0"
description = "Local pose, costume and hairstyle reference galleries for ComfyUI"
requires-python = ">=3.10"
dependencies = ["Pillow", "numpy", "torch", "aiohttp"]
license = {text = "MIT for code; upstream gallery artwork and data have separate terms"}

[project.urls]
Repository = "https://github.com/wuzhenyuu/comfyui-reference-gallery"
Issues = "https://github.com/wuzhenyuu/comfyui-reference-gallery/issues"

[tool.comfy]
DisplayName = "Reference Gallery 姿势、服装与发型图库"
